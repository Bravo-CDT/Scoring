# The real lab network's config. Copy to config.yaml, or run with
# CONFIG=config.lab.yaml. See config.example.yaml for the full per-field and
# per-check-type reference.
#
# The service passwords below are the competition's known starting default
# (Patty321!) -- blue teams are expected to rotate it on their boxes later,
# at which point these checks will start failing until this file (or the
# live service's entry via POST /reload) is updated to match.
#
# Before `make run`, still set ADMIN_PASSWORD_HASH in the environment (see
# `make hash`) -- that's the scoring engine's own admin login, not a service
# credential, and is deliberately kept out of this file.
#
# round_interval_seconds, points_per_failure, and mass_failure_fraction below
# are starting points -- tune them to match whatever cadence/weighting you
# actually want for the competition.
session_name: "krusty-krab-comp"
starting_score: 1000
round_interval_seconds: 30
mass_failure_fraction: 0.8

admin:
  username: admin
  password_hash: ${ADMIN_PASSWORD_HASH}

services:
  - name: apache
    host: 10.111.1.4
    check_type: http
    points_per_failure: 10
    params:
      port: 80

  - name: postgresql
    host: 10.111.1.2
    check_type: postgres
    points_per_failure: 10
    params:
      port: 5432
      user: mrkrabs
      password: Patty321!
      dbname: KrustySafe

  - name: smb
    host: 10.111.1.1
    check_type: smb
    points_per_failure: 10
    params:
      port: 445
      user: mrkrabs
      password: Patty321!
      share: sambashare
      expect_share: sambashare
      expect_file: secretformula.txt

  - name: smtp
    host: 10.111.1.3
    check_type: smtp
    points_per_failure: 10
    params:
      port: 587
      user: mrkrabs
      password: Patty321!
      # The lab's mail server almost certainly uses a self-signed cert.
      insecure_skip_verify: true

  - name: nginx-docker
    host: 10.111.1.5
    check_type: http_exclusive
    points_per_failure: 10
    params:
      port: 80
      expect_contains_ci: wordpress
      closed_port: 8080
